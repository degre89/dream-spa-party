<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6b6ee"><title>Dream Spa Party · V0.2 Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#6e3875}body{background:#d7b1ec}.app{height:100dvh;max-width:470px;min-height:570px;margin:auto;overflow:hidden;position:relative;background:radial-gradient(ellipse at 18% 12%,#fff9 0,transparent 45%),linear-gradient(165deg,#b9ecf5,#f6c7ec 65%,#d8a2ed)}.screen{display:none;position:absolute;inset:0;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);flex-direction:column;align-items:center}.screen.on{display:flex}.glitter{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 2px,transparent 3px),radial-gradient(#fff9 1.5px,transparent 2px);background-size:91px 121px,63px 83px;background-position:10px 10px,30px 55px;opacity:.7}.top{z-index:2;display:flex;justify-content:space-between;width:100%;align-items:center;padding-top:20px}.pill{border:2px solid #fff9;background:#fff9;border-radius:40px;padding:9px 15px;font-weight:900;box-shadow:0 5px 12px #92569b22}.logo{font-size:clamp(43px,11vw,61px);line-height:1.02;text-align:center;color:white;text-shadow:0 4px 0 #d56dbb,0 8px 0 #a56cbb,0 12px 20px #8e5c9e55;margin:7vh 0 10px;letter-spacing:-2px;z-index:1}.subtitle{font-size:17px;font-weight:800;text-align:center;z-index:1}.room{position:relative;width:100%;flex:1;min-height:0;margin-top:12px;display:flex;justify-content:center;align-items:center}.room:before{content:"";position:absolute;inset:8% 0 9%;border:12px solid #fce5fb;border-radius:45% 45% 22% 22%;background:radial-gradient(circle at 50% 30%,#fffaf9,#f9d3ee 68%,#dba1d8);box-shadow:inset 0 0 0 5px #fff8,0 16px 25px #ab76a15c}.shelf{position:absolute;bottom:12%;width:94%;height:15px;border-radius:10px;background:linear-gradient(#fff,#d6a6ce);box-shadow:0 7px #c287b9}.jar{position:absolute;bottom:16%;left:8%;font-size:48px;filter:drop-shadow(0 5px 4px #a65b9866)}.flower{position:absolute;right:6%;top:22%;font-size:47px}.girl{position:relative;width:min(72vw,295px);height:min(78vw,335px);max-height:42dvh;z-index:1;filter:drop-shadow(0 15px 13px #ab719277)}.hairback{position:absolute;inset:3% 2% 0;background:linear-gradient(90deg,#673847,#b46861 50%,#663847);border-radius:47% 47% 37% 37%}.neck{position:absolute;left:41%;bottom:2%;width:18%;height:22%;background:#f6b89d;border-radius:40%}.face{position:absolute;inset:16% 13% 13%;border-radius:45% 45% 46% 46%;background:radial-gradient(ellipse at 40% 35%,#ffe9d3 0%,#f8c3a9 66%,#e79a8e 100%);box-shadow:inset -9px -9px 20px #b96e7555,inset 6px 5px 12px #fff9;overflow:hidden}.fringe{position:absolute;left:7%;top:2%;width:86%;height:24%;background:linear-gradient(135deg,#74404b,#b97163 55%,#72434a);border-radius:50% 50% 43% 20%;transform:rotate(-5deg)}.eye{position:absolute;top:44%;width:15%;height:12%;border-radius:50%;background:#503a45;border:4px solid #fff;box-shadow:0 0 0 2px #8d5360}.eye:after{content:"";position:absolute;top:12%;left:19%;width:38%;height:38%;border-radius:50%;background:white}.eye.l{left:23%}.eye.r{right:23%}.cheek{position:absolute;top:59%;width:21%;height:11%;border-radius:50%;background:#ee8e9a88;filter:blur(5px)}.cheek.l{left:9%}.cheek.r{right:9%}.nose{position:absolute;left:48%;top:62%;width:6%;height:4%;border-radius:50%;background:#d9948b}.smile{position:absolute;left:40%;top:71%;width:20%;height:9%;border-bottom:4px solid #c26d7d;border-radius:50%}.bow{position:absolute;top:3%;left:27%;font-size:67px;filter:drop-shadow(0 4px 4px #733d7855);z-index:2}.robe{position:absolute;bottom:-3%;left:10%;width:80%;height:27%;background:linear-gradient(130deg,#fff,#f8d6f4 70%,#e2a8e4);border:7px solid white;border-radius:45% 45% 5% 5%;z-index:2}.robe:after{content:"♡";position:absolute;top:14%;left:44%;font-size:26px;color:#e48cbe}.cta{z-index:2;border:4px solid white;border-radius:45px;background:linear-gradient(#ffa4dd,#ee55b3 70%,#d63e9b);box-shadow:0 7px 0 #a94b99,0 12px 18px #9c57995c;color:white;font-weight:1000;font-size:23px;padding:13px 35px;min-width:190px;cursor:pointer;touch-action:manipulation}.cta:disabled{opacity:.55}.bottom{z-index:2;margin:16px 0 27px;text-align:center}.small{font-size:12px;margin-top:12px;font-weight:800;color:#a26c9d}.title{font-size:27px;color:#fff;text-shadow:0 3px #bc69b7;margin:18px 0 8px;text-align:center}.spa-room{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.spa-room:before{content:"";position:absolute;inset:2% 0 6%;background:radial-gradient(ellipse,#fff7 10%,#e5b8e3 80%);border:9px solid #fff9;border-radius:45% 45% 24% 24%}.towel{position:absolute;bottom:7%;left:2%;font-size:46px}.bottle{position:absolute;bottom:7%;right:2%;font-size:45px}.treatment{position:relative;width:min(79vw,330px);height:min(90vw,390px);max-height:49dvh;border:9px solid #ffe9fc;border-radius:44% 44% 37% 37%;box-shadow:0 13px 25px #8e53855a;overflow:hidden;touch-action:none;background:#f4b69e}.treatment .hairback{inset:0}.treatment .face{inset:14% 8% 2%}.treatment .bow{left:31%;top:0}.treatment canvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none}.instruction{background:#fffbe9df;border:3px solid white;border-radius:25px;padding:10px 14px;text-align:center;font-weight:900;font-size:15px;z-index:2;width:100%}.meter{height:15px;width:90%;border-radius:15px;border:3px solid white;background:#ffffff88;overflow:hidden;margin:12px}.meter>div{height:100%;width:0;background:linear-gradient(90deg,#87dfaa,#59caa0);transition:width .1s}.actions{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 20px;z-index:2}.textbtn{background:transparent;border:0;color:#854d86;font-weight:900;font-size:14px;padding:6px}.reward{font-size:78px;margin:12vh 0 5vh;animation:bounce 1.3s infinite alternate}.rewardTitle{font-size:39px;color:white;text-shadow:0 5px #c463b5}.rewardCard{border:4px solid white;background:#fff9;border-radius:28px;padding:25px;text-align:center;font-size:22px;font-weight:900;margin:28px 0}.confetti{font-size:44px}@keyframes bounce{to{transform:translateY(-15px) rotate(6deg)}}@media(max-height:720px){.logo{margin:3vh 0 4px}.room{margin-top:0}.bottom{margin:5px 0 12px}.title{margin:9px 0 4px}.actions{margin:4px 0 9px}.reward{margin:6vh 0 3vh}}
</style></head><body><div class="app"><div class="glitter"></div>
<section class="screen on" id="home"><div class="top"><span class="pill">🌸 V0.2 Preview</span><span class="pill">⭐ <b id="total">0</b></span></div><h1 class="logo">Dream<br>Spa Party</h1><div class="subtitle">✨ Il tuo salone magico ✨</div><div class="room"><div class="shelf"></div><div class="jar">🧴</div><div class="flower">🌷</div><div class="girl"><div class="hairback"></div><div class="neck"></div><div class="face"><div class="fringe"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="nose"></div><div class="smile"></div></div><div class="robe"></div><div class="bow">🎀</div></div></div><div class="bottom"><button class="cta" id="play">▶ Gioca</button><div class="small">Prototipo Cartoon · test privato</div></div></section>
<section class="screen" id="spa"><div class="top"><button class="pill textbtn" id="back">⌂ Home</button><span class="pill" id="step">1 / 2 · Maschera</span></div><h2 class="title">🫧 Momento Spa</h2><div class="spa-room"><div class="towel">🧺</div><div class="bottle">🧴</div><div class="treatment" id="facebox"><div class="hairback"></div><div class="face"><div class="fringe"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="nose"></div><div class="smile"></div></div><div class="bow">🎀</div><canvas id="paint"></canvas></div></div><div class="instruction" id="hint">💚 Stendi la maschera con il dito!</div><div class="meter"><div id="meter"></div></div><div id="progress" style="font-weight:900">0%</div><div class="actions"><button class="cta" id="next" disabled>Continua ➜</button></div></section>
<section class="screen" id="done"><div class="reward">🌟✨🌟</div><h2 class="rewardTitle">Fantastico!</h2><div class="rewardCard">Spa completata!<br><span class="confetti">🎉</span><br>Hai guadagnato <b>3 ⭐</b></div><button class="cta" id="again">Gioca ancora</button><button class="textbtn" id="finishHome" style="margin:22px">⌂ Torna alla Home</button></section></div>
<script>
const $=s=>document.querySelector(s);const show=s=>{document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===s))};let phase=0,active=false,last=null,visited=new Set(),ctx,w,h;const cells=[[.3,.37],[.5,.34],[.7,.37],[.27,.49],[.5,.48],[.73,.49],[.3,.6],[.5,.6],[.7,.6]];function progress(){const p=Math.round(visited.size/cells.length*100);$('#meter').style.width=p+'%';$('#progress').textContent=p+'%';$('#next').disabled=p<100}function start(){show('spa');phase=0;visited.clear();$('#step').textContent='1 / 2 · Maschera';$('#hint').textContent='💚 Stendi la maschera con il dito!';$('#next').textContent='Continua ➜';const c=$('#paint'),r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=Math.round(w*d);c.height=Math.round(h*d);ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);progress()}function draw(x,y){const a=x/w,b=y/h;if(((a-.5)/.43)**2+((b-.5)/.38)**2>1||b<.25||b>.79)return;ctx.globalCompositeOperation=phase?'destination-out':'source-over';ctx.fillStyle='#91dba9';ctx.beginPath();ctx.arc(x,y,w*.075,0,Math.PI*2);ctx.fill();cells.forEach((v,i)=>{if(Math.hypot(a-v[0],b-v[1])<.14)visited.add(i)});progress()}const c=$('#paint');function pointer(e){if(!active)return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(last){const n=Math.max(1,Math.ceil(Math.hypot(x-last.x,y-last.y)/6));for(let i=1;i<=n;i++)draw(last.x+(x-last.x)*i/n,last.y+(y-last.y)*i/n)}else draw(x,y);last={x,y}}c.addEventListener('pointerdown',e=>{active=true;last=null;c.setPointerCapture(e.pointerId);pointer(e)});c.addEventListener('pointermove',pointer);['pointerup','pointercancel','lostpointercapture'].forEach(e=>c.addEventListener(e,()=>{active=false;last=null}));$('#play').onclick=start;$('#again').onclick=start;$('#back').onclick=()=>show('home');$('#finishHome').onclick=()=>show('home');$('#next').onclick=()=>{if(!phase){phase=1;visited.clear();$('#step').textContent='2 / 2 · Risciacquo';$('#hint').textContent='💦 Togli la maschera con il dito!';$('#next').textContent='Finisci ✨';progress()}else{const total=Number(localStorage.getItem('dsp-stars')||0)+3;localStorage.setItem('dsp-stars',total);$('#total').textContent=total;show('done')}};$('#total').textContent=localStorage.getItem('dsp-stars')||'0';
</script></body></html>
