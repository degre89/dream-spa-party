<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#592754">
  <title>Dream Spa Party</title>
  <link rel="stylesheet" href="spa.css?v=06a">
  <script type="module" src="spa.js?v=06a"></script>
</head>
<body>
<main class="app">
  <section class="screen on" id="home">
    <header class="top"><span class="pill">✿ Dream Spa</span><span class="pill">★ <span id="stars">0</span></span></header>
    <h1>Dream <span>Spa Party</span></h1>
    <p class="tagline">Il tuo salone magico</p>
    <div class="stage"><div class="portrait"><img class="hero" src="assets/girl.webp" alt="La protagonista con un fiocco rosa" draggable="false"><img class="expression eyelids" src="assets/eyelids.svg" alt="" draggable="false"><img class="expression grin" src="assets/smile.svg" alt="" draggable="false"></div></div>
    <footer><button class="cta" id="play" disabled>▶ Gioca</button><p id="status" role="status">La tua prima giornata alla Spa!</p></footer>
  </section>
  <section class="screen" id="choose">
    <header class="top"><button class="pill" id="chooseHome">⌂ Home</button><span class="pill">✿ Le clienti</span></header>
    <h2>Scegli una cliente</h2>
    <p class="tagline">Chi coccoliamo oggi?</p>
    <div class="clients" role="group" aria-label="Clienti disponibili"></div>
    <p id="chooseStatus" role="status"></p>
  </section>
  <section class="screen" id="spa">
    <header class="top"><button class="pill" id="back">⌂ Home</button><span class="pill" id="step"></span></header>
    <h2 id="goal">Momento Spa</h2>
    <div class="dialogue">
      <p id="hint" role="status" aria-atomic="true"></p>
      <button id="repeatHint" type="button" aria-label="Ripeti il suggerimento">?</button>
    </div>
    <div class="stage">
      <div id="character">
        <div class="portrait"><img class="hero" alt="" draggable="false"><img class="expression spa-eyelids" alt="" draggable="false"><canvas class="reaction-face" width="768" height="960" aria-hidden="true" hidden></canvas></div>
        <canvas id="mask" width="512" height="640" aria-label="Superficie del trattamento"></canvas>
        <span id="tool" aria-hidden="true"></span>
      </div>
    </div>
    <footer class="treatment-controls">
      <div class="readout">
        <div id="meter" role="progressbar" aria-label="Progresso del trattamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
        <output id="percent">0%</output>
      </div>
      <div class="treatment-actions">
        <button class="cta" id="steamStart" aria-pressed="false">Vaporizzatore</button>
        <button class="pill" id="cartToggle" aria-expanded="false" aria-controls="cart">▤ Carrello</button>
        <button class="cta" id="next" hidden>Risciacqua</button>
      </div>
      <div id="cart" hidden role="group" aria-label="Carrello dei trattamenti">
        <div id="cartTools" class="tool-grid">
          <button class="spa-tool" id="maskToggle" type="button" aria-expanded="false" aria-controls="maskPanel"><img src="assets/jar-strawberry.svg" alt="">Maschere</button>
        </div>
        <div id="maskPanel" hidden>
          <button id="maskBack" type="button">‹ Carrello</button>
          <div id="maskOptions" class="tool-grid" role="group" aria-label="Scegli una maschera"></div>
        </div>
      </div>
    </footer>
  </section>
  <section class="screen" id="done">
    <header class="top"><button class="pill" id="goHome">⌂ Home</button><span class="pill" id="totalStars"></span></header>
    <h2>Fantastico!</h2>
    <div class="stage">
      <div class="portrait"><img class="hero" alt="" draggable="false"><canvas class="reaction-face" width="768" height="960" aria-hidden="true" hidden></canvas><canvas id="comparison" width="512" height="640" aria-label="Pelle dopo il trattamento"></canvas></div>
      <div class="award" aria-hidden="true">✦ ★ ✦</div>
    </div>
    <footer>
      <div class="compare-controls" role="group" aria-label="Confronto della pelle">
        <button class="pill" id="before" aria-pressed="false">Prima</button>
        <button class="pill" id="after" aria-pressed="true">Dopo</button>
      </div>
      <p class="reward">Hai guadagnato 3 stelle!</p>
      <button class="cta" id="again">Nuova seduta</button>
    </footer>
  </section>
</main>
</body>
</html>
