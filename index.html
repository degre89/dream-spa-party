<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#e58cdd"><title>Dream Spa Party V0.1</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#dba7ee;color:#752778}.app{max-width:430px;margin:auto;height:100dvh;min-height:580px;position:relative;overflow:hidden;background:linear-gradient(150deg,#b8eaff,#f8c5ed 60%,#c18de5)}section{display:none;height:100%;flex-direction:column;align-items:center;text-align:center;padding:22px 14px}section.active{display:flex}h1{font-size:clamp(42px,11vw,65px);line-height:1.05;margin:60px 0 8px;color:#fff;text-shadow:0 5px #b23ba6,0 9px #803b9c}h2{color:white;text-shadow:0 3px #ad4eae;margin:8px 0 18px}.decor{font-size:70px;margin:20px}.btn{border:3px solid white;border-radius:40px;background:linear-gradient(#ff9ce3,#ed369c);box-shadow:0 6px #b42c83;color:white;font-size:24px;font-weight:900;padding:12px 28px;margin:10px;touch-action:manipulation}.btn:disabled{opacity:.45}.facebox{position:relative;width:min(82vw,330px);height:min(100vw,390px);max-height:49dvh;margin:10px auto 16px;border-radius:44% 44% 28% 28%;background:radial-gradient(circle at 50% 25%,#ffe9cb,#f5ac8d);border:9px solid #f8d6ff;box-shadow:0 15px 30px #80448b66;overflow:hidden;touch-action:none}.hair{position:absolute;top:0;left:0;right:0;height:25%;background:#9b562f;border-radius:0 0 50% 50%}.bow{position:absolute;top:0;left:30%;font-size:60px;z-index:2}.eyes{position:absolute;top:43%;left:0;width:100%;font-size:52px;letter-spacing:22px;color:#6b3c3b}.nose{position:absolute;top:61%;left:48%;font-size:19px}.mouth{position:absolute;top:70%;left:38%;font-size:46px;color:#d86b78}.facebox canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none}.hint{font-weight:800;background:#ffffffb8;border-radius:24px;padding:12px 18px}.bar{width:80%;height:16px;background:#fff9;border:2px solid white;border-radius:15px;overflow:hidden}.fill{height:100%;background:#75d65a;width:0}.stars{font-size:72px;margin:65px 0 15px}small{opacity:.8}</style><main class="app"><section id="home" class="active"><div class="decor">🌸 🫧 🦄</div><h1>Dream<br>Spa Party</h1><p>La tua spa magica ti aspetta!</p><div style="font-size:100px;margin:25px">👧🏻🎀</div><button class="btn" onclick="start()">▶ Gioca</button><small>Demo V0.1 · senza pubblicità</small></section><section id="spa"><h2>🫧 Trattamento Spa</h2><div id="step">1 · Maschera</div><div class="facebox"><div class="hair"></div><div class="bow">🎀</div><div class="eyes">◕ ◕</div><div class="nose">•</div><div class="mouth">⌣</div><canvas id="canvas"></canvas></div><div class="hint" id="hint">Passa il dito sulle guance e sulla fronte!</div><div class="bar" style="margin-top:14px"><div class="fill" id="fill"></div></div><p id="percent">0%</p><button id="next" class="btn" disabled onclick="next()">Continua ➜</button><button onclick="show('home')" style="background:none;border:0;color:#753c80">⌂ Home</button></section><section id="finish"><div class="stars">⭐✨⭐</div><h2>Fantastico!</h2><p>Trattamento completato!<br>Hai guadagnato 3 stelline!</p><button class="btn" onclick="start()">Gioca ancora</button><button class="btn" onclick="show('home')">Home</button></section></main><script>const el=id=>document.getElementById(id);let ctx,phase=0,down=false,seen=new Set(),last=null;const spots=[[.3,.4],[.5,.35],[.7,.4],[.3,.55],[.5,.55],[.7,.55]];function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id))}function start(){show('spa');phase=0;seen.clear();el('step').textContent='1 · Maschera';el('hint').textContent='Passa il dito sulle guance e sulla fronte!';el('next').textContent='Continua ➜';const c=el('canvas'),r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);update()}function update(){let p=Math.round(seen.size/spots.length*100);el('fill').style.width=p+'%';el('percent').textContent=p+'%';el('next').disabled=p<100}function paint(x,y){const c=el('canvas'),w=c.clientWidth,h=c.clientHeight,nx=x/w,ny=y/h;if(((nx-.5)/.4)**2+((ny-.48)/.37)**2>1||ny<.23||ny>.73)return;ctx.globalCompositeOperation=phase?'destination-out':'source-over';ctx.fillStyle='#89d86a';ctx.beginPath();ctx.arc(x,y,w*.09,0,7);ctx.fill();spots.forEach((p,i)=>{if(Math.hypot(nx-p[0],ny-p[1])<.17)seen.add(i)});update()}function move(e){if(!down)return;const r=el('canvas').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(last){let n=Math.ceil(Math.hypot(x-last.x,y-last.y)/6);for(let i=1;i<=n;i++)paint(last.x+(x-last.x)*i/n,last.y+(y-last.y)*i/n)}else paint(x,y);last={x,y}}const c=el('canvas');c.addEventListener('pointerdown',e=>{down=true;last=null;c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',move);['pointerup','pointercancel','lostpointercapture'].forEach(t=>c.addEventListener(t,()=>{down=false;last=null}));function next(){if(!phase){phase=1;seen.clear();el('step').textContent='2 · Risciacquo';el('hint').textContent='Ora togli la maschera con il dito!';el('next').textContent='Finisci ✨';update()}else show('finish')}</script></html>
