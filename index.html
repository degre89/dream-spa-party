<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Dream Spa Party</title><style>
*{box-sizing:border-box}body{margin:0;background:#dba5e5;font-family:system-ui,"Trebuchet MS",sans-serif;color:#71326e}.app{max-width:460px;margin:auto;height:100dvh;min-height:590px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#fff8,transparent 44%),linear-gradient(155deg,#c5eefa,#f9c5eb 70%,#c989df)}.screen{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;padding:15px 16px 20px}.screen.on{display:flex}.lights{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 2px,transparent 4px);background-size:69px 87px;opacity:.6}.top{width:100%;display:flex;align-items:center;justify-content:space-between;z-index:3;margin:8px 0}.pill{border:3px solid white;background:#ffffffba;border-radius:35px;padding:8px 13px;font-size:15px;font-weight:900;color:#793d84;box-shadow:0 5px 10px #86538b24}.logo{color:#fff;text-align:center;font-weight:1000;font-size:clamp(45px,12vw,65px);line-height:.97;text-shadow:0 5px #c653aa,0 9px #9e4d9b,0 12px 16px #6d397b6b;margin:5vh 0 10px;z-index:2}.sub{font-weight:900;font-size:18px;z-index:2}.stage{width:100%;position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.stage:before{content:"";position:absolute;inset:5% 1%;border:12px solid #fff0f9;border-radius:48% 48% 28% 28%;background:radial-gradient(circle,#fff4fb,#e9b6e2);box-shadow:0 12px 20px #8d568755,inset 0 0 0 5px #fff7}.deco{position:absolute;font-size:42px;z-index:1;filter:drop-shadow(0 5px 4px #7e517e55)}.deco.a{left:1%;bottom:9%}.deco.b{right:1%;bottom:11%}.deco.c{right:2%;top:14%}.character{position:relative;width:min(82vw,335px);aspect-ratio: .83;max-height:51dvh;z-index:2;filter:drop-shadow(0 13px 10px #95598b88)}.hair{position:absolute;inset:2% 1% 0;border-radius:46% 46% 35% 35%;background:linear-gradient(95deg,#69362d,#bd7044 35%,#9d4b35 65%,#61332c);box-shadow:inset -14px 2px 20px #4f252b88}.head{position:absolute;inset:15% 11% 8%;border-radius:45% 45% 47% 47%;background:radial-gradient(ellipse at 42% 32%,#ffe6c6 10%,#f7bb9b 70%,#d58b80);box-shadow:inset -9px -8px 18px #c7777455,inset 7px 4px 12px #fff9;overflow:hidden}.fringe{position:absolute;top:-1%;left:5%;width:90%;height:19%;background:linear-gradient(135deg,#6f352c,#b86945,#70332d);border-radius:10% 30% 48% 25%;transform:rotate(-4deg)}.brow{position:absolute;top:38%;width:18%;height:3%;border-top:4px solid #874b3c;border-radius:50%}.brow.l{left:20%}.brow.r{right:20%}.eye{position:absolute;top:43%;width:19%;height:17%;background:#fff;border:3px solid #764d4b;border-radius:48%;box-shadow:0 3px 0 #ac615b}.eye.l{left:18%}.eye.r{right:18%}.eye:before{content:"";position:absolute;inset:10% 14%;border-radius:50%;background:radial-gradient(circle at 42% 36%,#fff 0 10%,#172a41 12% 35%,#3198bd 38% 67%,#174c72 71%)}.blush{position:absolute;top:63%;width:22%;height:10%;background:#f17d8980;border-radius:50%;filter:blur(7px)}.blush.l{left:7%}.blush.r{right:7%}.nose{position:absolute;top:64%;left:46%;width:8%;height:5%;border-radius:50%;background:#db9282}.mouth{position:absolute;top:74%;left:38%;width:24%;height:10%;border-bottom:5px solid #bd6572;border-radius:50%}.band{position:absolute;left:9%;top:4%;width:82%;height:16%;background:linear-gradient(#ffc7e9,#ef75b4);border:5px solid #ffdff1;border-radius:60% 60% 30% 30%;transform:rotate(-3deg);box-shadow:0 5px #bb5e8e}.bow{position:absolute;top:-2%;left:31%;font-size:75px;filter:drop-shadow(0 3px 3px #874268)}.robe{position:absolute;bottom:-2%;left:6%;width:88%;height:25%;border:7px solid white;background:linear-gradient(130deg,#ffe3f3,#ef99c8);border-radius:48% 48% 8% 8%;z-index:3}.robe:after{content:"♡";position:absolute;left:45%;top:10%;color:#c855a5;font-size:28px}.cta{background:linear-gradient(#fface6,#ee4fb2);border:4px solid white;border-radius:42px;color:white;box-shadow:0 7px #a64a91;font-size:23px;font-weight:1000;padding:12px 29px;min-width:180px;touch-action:manipulation}.cta:disabled{opacity:.45}.foot{z-index:4;margin:12px 0 16px;text-align:center}.foot small{display:block;margin-top:15px;font-weight:700}.title{font-size:25px;color:white;text-shadow:0 4px #b65ca5;margin:12px 0 2px;z-index:2}.spaStage{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.spaStage:before{content:"";position:absolute;inset:1% 0 3%;border:10px solid #ffecfa;border-radius:46% 46% 27% 27%;background:radial-gradient(circle,#fff7f6,#edb8e6);box-shadow:0 10px 20px #92548b55}.spaStage .character{width:min(85vw,350px);max-height:51dvh}.spaStage .robe{bottom:-5%}.spaStage .deco{font-size:35px}.maskCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none}.sponge{position:absolute;z-index:9;font-size:49px;pointer-events:none;display:none;filter:drop-shadow(0 4px 4px #86577b66);transform:translate(-50%,-50%)}.instruction{z-index:3;width:100%;background:#fff8e9e8;border:3px solid white;border-radius:24px;padding:11px;text-align:center;font-weight:900;font-size:15px}.meter{z-index:3;width:90%;height:17px;background:#fff8;border:3px solid white;border-radius:16px;overflow:hidden;margin:12px}.meter div{height:100%;width:0;background:linear-gradient(90deg,#75dcb6,#51be9b)}.percent{z-index:3;font-weight:900}.actions{z-index:3;margin:9px 0 8px}.reward{font-size:80px;margin:15vh 0 6vh;animation:float 1s alternate infinite}.rewardTitle{font-size:40px;color:white;text-shadow:0 5px #bc58ad}.rewardBox{padding:24px;background:#fff9;border:4px solid white;border-radius:24px;text-align:center;font-size:22px;font-weight:900;margin:24px 0 36px}@keyframes float{to{transform:translateY(-13px)}}@media(max-height:730px){.logo{margin:1vh 0 4px}.title{margin:3px}.foot{margin:2px}.actions{margin:3px}.stage{min-height:0}.character{max-height:43dvh}.spaStage .character{max-height:45dvh}.reward{margin:7vh 0}}
</style></head><body><main class="app"><div class="lights"></div><section class="screen on" id="home"><div class="top"><span class="pill">🌸 Dream Spa</span><span class="pill">⭐ <span id="stars">0</span></span></div><h1 class="logo">Dream<br>Spa Party</h1><div class="sub">✨ Il tuo salone magico ✨</div><div class="stage"><span class="deco a">🧴</span><span class="deco b">🧼</span><span class="deco c">🌷</span><div class="character"><div class="hair"></div><div class="head"><div class="fringe"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="blush l"></div><div class="blush r"></div><div class="nose"></div><div class="mouth"></div></div><div class="band"></div><div class="bow">🎀</div><div class="robe"></div></div></div><div class="foot"><button class="cta" id="play">▶ Gioca</button><small>La tua prima giornata alla Spa!</small></div></section>
<section class="screen" id="spa"><div class="top"><button class="pill" id="back">⌂ Home</button><span class="pill" id="step">1 / 2 · Maschera</span></div><h2 class="title">🫧 Momento Spa</h2><div class="spaStage"><span class="deco a">🧺</span><span class="deco b">🧴</span><div class="character" id="character"><div class="hair"></div><div class="head"><div class="fringe"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="blush l"></div><div class="blush r"></div><div class="nose"></div><div class="mouth"></div></div><div class="band"></div><div class="bow">🎀</div><div class="robe"></div><canvas class="maskCanvas" id="mask"></canvas><div class="sponge" id="sponge">🧽</div></div></div><div class="instruction" id="hint">💚 Stendi la maschera sulla pelle!</div><div class="meter"><div id="fill"></div></div><div class="percent" id="percent">0%</div><div class="actions"><button class="cta" id="next" disabled>Continua ➜</button></div></section>
<section class="screen" id="done"><div class="reward">🌟✨🌟</div><h2 class="rewardTitle">Fantastico!</h2><div class="rewardBox">Trattamento completato!<br>Hai guadagnato 3 ⭐</div><button class="cta" id="again">Gioca ancora</button><button class="pill" id="goHome" style="margin:25px">⌂ Home</button></section></main>
<script>
const $=s=>document.querySelector(s);const show=s=>document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===s));let ctx,mask,phase=0,down=false,last=null,w,h,ratio,eligible=[],count=0,done=0;const GRID=5;function allowed(x,y){let u=x/w,v=y/h;let fx=(u-.5)/.365,fy=(v-.55)/.34;if(fx*fx+fy*fy>1||v<.26||v>.83)return false;if(v<.35)return false;let eye=(cx)=>(((u-cx)/.092)**2+((v-.50)/.068)**2)<1.5;if(eye(.35)||eye(.65))return false;if(v>.46&&v<.58&&u>.40&&u<.60)return false;if((((u-.5)/.135)**2+((v-.70)/.075)**2)<1.4)return false;return true}
function setup(){const c=$('#mask'),r=c.getBoundingClientRect();w=r.width;h=r.height;ratio=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*ratio);c.height=Math.round(h*ratio);ctx=c.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);mask=new Uint8Array(Math.ceil(w/GRID)*Math.ceil(h/GRID));eligible=[];count=done=0;for(let j=0;j<Math.ceil(h/GRID);j++)for(let i=0;i<Math.ceil(w/GRID);i++)if(allowed(i*GRID+GRID/2,j*GRID+GRID/2)){eligible.push(j*Math.ceil(w/GRID)+i);count++}progress()}
function progress(){let p=Math.min(100,Math.round(done/Math.max(1,count)*100));$('#fill').style.width=p+'%';$('#percent').textContent=p+'%';$('#next').disabled=p<93}
function dab(x,y){let radius=phase?23:18;let cellsX=Math.ceil(w/GRID),x0=Math.max(0,Math.floor((x-radius)/GRID)),x1=Math.min(cellsX-1,Math.ceil((x+radius)/GRID)),y0=Math.max(0,Math.floor((y-radius)/GRID)),y1=Math.min(Math.ceil(h/GRID)-1,Math.ceil((y+radius)/GRID));ctx.fillStyle='#93d9a8';for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){let px=i*GRID+GRID/2,py=j*GRID+GRID/2;if((px-x)**2+(py-y)**2>radius*radius||!allowed(px,py))continue;let k=j*cellsX+i;if(phase===0){if(mask[k])continue;mask[k]=1;done++;ctx.fillRect(i*GRID,j*GRID,GRID+1,GRID+1)}else{if(!mask[k])continue;mask[k]=0;done++;ctx.clearRect(i*GRID,j*GRID,GRID+1,GRID+1)}}progress()}
function start(){show('spa');phase=0;setup();$('#step').textContent='1 / 2 · Maschera';$('#hint').textContent='💚 Stendi la maschera sulla pelle!';$('#next').textContent='Continua ➜';$('#sponge').style.display='none'}
const c=$('#mask');function point(e){if(!down)return;let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(phase){let s=$('#sponge');s.style.display='block';s.style.left=x+'px';s.style.top=y+'px'}let n=last?Math.ceil(Math.hypot(x-last.x,y-last.y)/6):1;for(let i=1;i<=n;i++)dab(last?last.x+(x-last.x)*i/n:x,last?last.y+(y-last.y)*i/n:y);last={x,y}}
c.addEventListener('pointerdown',e=>{down=true;last=null;c.setPointerCapture(e.pointerId);point(e)});c.addEventListener('pointermove',point);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,()=>{down=false;last=null;$('#sponge').style.display='none'}));$('#play').onclick=start;$('#again').onclick=start;$('#back').onclick=()=>show('home');$('#goHome').onclick=()=>show('home');$('#next').onclick=()=>{if(!phase){phase=1;done=0;count=mask.reduce((a,b)=>a+b,0);$('#step').textContent='2 / 2 · Risciacquo';$('#hint').textContent='🧽 Trascina la spugnetta per pulire!';$('#next').textContent='Finisci ✨';progress()}else{let n=Number(localStorage.getItem('dsp-stars')||0)+3;localStorage.setItem('dsp-stars',n);$('#stars').textContent=n;show('done')}};$('#stars').textContent=localStorage.getItem('dsp-stars')||'0';
</script></body></html>
