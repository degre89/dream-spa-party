name: Phase 02 browser checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [index.html, spa.js, spa.css, 'assets/**']
permissions:
  contents: read
jobs:
  chromium:
    if: github.event_name == 'push' || github.head_ref == 'development/phase02-magic-masks'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --fetch-retries=1 playwright
      - name: Check live Pages bytes
        if: github.event_name == 'push'
        run: |
          base=https://degre89.github.io/dream-spa-party
          for attempt in $(seq 1 35); do
            if curl -fsS --max-time 8 "$base/?release=$GITHUB_SHA" -o /tmp/spa-pages-index && cmp -s index.html /tmp/spa-pages-index; then break; fi
            sleep 6
          done
          cmp index.html /tmp/spa-pages-index
          for file in spa.js spa.css assets/{girl.webp,spa.webp,skin.svg,eyelids.svg,smile.svg,jar-*.svg}; do
            curl -fsS --max-time 15 "$base/$file?release=$GITHUB_SHA" -o /tmp/spa-pages-file
            cmp "$file" /tmp/spa-pages-file
          done
      - name: Exercise the four treatments
        env:
          LIVE: ${{ github.event_name == 'push' }}
        run: |
          python3 -m http.server 8000 &
          for attempt in $(seq 1 10); do curl -fsS http://localhost:8000/ -o /dev/null && break; sleep 1; done
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({channel:'chrome'});
            try {
              for (const [width,height,touch] of [[320,568,true],[412,915,true],[1280,720,false]]) {
                const ctx = await browser.newContext({viewport:{width,height},hasTouch:touch,isMobile:touch});
                const page = await ctx.newPage();
                const cdp = await ctx.newCDPSession(page);
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                page.on('response', r => { if(r.status()>=400 && !r.url().endsWith('/favicon.ico')) errors.push(r.url()+' '+r.status()); });
                await page.goto(process.env.LIVE === 'true' ? 'https://degre89.github.io/dream-spa-party/' : 'http://localhost:8000/');
                await page.locator('#play:enabled').waitFor();
                const blink = await page.evaluate(() => new Promise(resolve => {
                  const portrait = document.querySelector('#home .portrait');
                  const observer = new MutationObserver(() => {
                    if (portrait.classList.contains('blink')) { observer.disconnect(); clearTimeout(limit); resolve(true); }
                  });
                  const limit = setTimeout(() => { observer.disconnect(); resolve(document.visibilityState); }, 6500);
                  observer.observe(portrait,{attributes:true,attributeFilter:['class']});
                  if (portrait.classList.contains('blink')) { observer.disconnect(); clearTimeout(limit); resolve(true); }
                }));
                assert.equal(blink,true,'natural blink observed');
                const activate = selector => touch ? page.locator(selector).tap() : page.locator(selector).click();
                await activate('#play');
                const color = [];
                for (const id of ['strawberry','avocado','blueberry','honey']) {
                  const jar = page.locator('[data-mask='+id+']');
                  if (touch) await jar.tap(); else await jar.click();
                  assert.equal(await jar.getAttribute('aria-pressed'),'true');
                  assert(await page.locator('#bubble').isVisible());
                  await page.screenshot({path:'choose-'+width+'.png'});
                  if(width===320&&id==='strawberry') console.log('CHOOSE_JPEG '+(await page.screenshot({type:'jpeg',quality:24})).toString('base64'));
                  await activate('#begin');
                  const b=await page.locator('#mask').boundingBox();
                  async function sweep(from,to) {
                    for (let v=from;v<=to;v+=.026) {
                      const y=Math.round(b.y+b.height*v), left=Math.round(b.x+b.width*.22), right=Math.round(b.x+b.width*.78);
                      if(touch) {
                        const dispatch=(type,points)=>cdp.send('Input.dispatchTouchEvent',{type,touchPoints:points});
                        await dispatch('touchStart',[{x:left,y}]);
                        await dispatch('touchMove',[{x:right,y}]);
                        await dispatch('touchEnd',[]);
                      } else {
                        await page.mouse.move(left,y);
                        await page.mouse.down();
                        await page.mouse.move(right,y);
                        await page.mouse.up();
                      }
                    }
                  }
                  const pixels = coords => page.locator('#mask').evaluate((c, coords)=>coords.map(([x,y])=>Array.from(c.getContext('2d').getImageData(x,y,1,1).data)),coords);
                  assert(await page.locator('#next').isDisabled());
                  await sweep(.34,.34);
                  assert(await page.locator('#spa .relax').isVisible());
                  if(width===320&&id==='strawberry') {
                    await page.waitForTimeout(220);
                    console.log('RELAX_JPEG '+(await page.screenshot({type:'jpeg',quality:24})).toString('base64'));
                  }
                  await sweep(.285,.70);
                  await page.locator('#next:enabled').waitFor();
                  const [forehead,...protectedPixels]=await pixels([[256,184],[194,294],[316,294],[257,387],[190,231],[257,90]]);
                  assert(forehead[3]>0);
                  assert(protectedPixels.every(p=>p[3]===0));
                  color.push(forehead.slice(0,3).join(','));
                  await page.screenshot({path:'apply-'+id+'-'+width+'.png'});
                  await activate('#next');
                  await page.locator('#character.rinsing').waitFor({timeout:3000});
                  await page.locator('#next:disabled').waitFor({timeout:3000});
                  await sweep(.34,.34);
                  assert(await page.locator('#spa .smile').isVisible());
                  await sweep(.285,.70);
                  await page.locator('#next:enabled').waitFor();
                  assert.equal((await pixels([[256,184]]))[0][3],0);
                  await activate('#next');
                  await page.locator('#done .smile').waitFor({timeout:3000});
                  await page.screenshot({path:'done-'+width+'.png'});
                  if(width===320&&id==='strawberry') {
                    const shot = await page.screenshot({type:'jpeg',quality:28});
                    console.log('VISUAL_JPEG '+shot.toString('base64'));
                  }
                  await activate('#again');
                }
                assert.equal(new Set(color).size,4);
                await page.reload();
                assert.equal(await page.locator('#stars').innerText(),'12');
                assert.deepEqual(errors,[]);
                console.log('PASS '+width+'×'+height+' touch='+touch);
                await ctx.close();
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase02-browser-screens
          path: '*.png'
