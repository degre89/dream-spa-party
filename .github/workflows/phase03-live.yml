name: Phase 07-BR live Pages checks

on:
  push:
    branches: [main]
    paths:
      - index.html
      - spa.js
      - spa.css
      - 'assets/**'
      - 'phase03/**'
      - 'phase04/**'
      - 'phase05/**'
      - 'phase06/**'
      - 'phase07/**'
      - '.github/scripts/verify-pages.py'
      - '.github/workflows/phase03-live.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SPA_URL: https://degre89.github.io/dream-spa-party/

jobs:
  public-assets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify the deployed files against the release commit
        run: |
          set -o pipefail
          mkdir -p test-results
          python3 .github/scripts/verify-pages.py 2>&1 | tee test-results/live-assets.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream-spa-phase07br-live-assets
          path: test-results/
          if-no-files-found: error

  live-chromium:
    needs: public-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: [320x568, 412x915, 1280x720]
    env:
      SPA_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Run the complete browser suites on the official site
        run: |
          set -o pipefail
          mkdir -p test-results
          node --test --test-concurrency=1 --test-reporter=tap phase04/browser.test.mjs phase06/browser.test.mjs phase06/shop.browser.test.mjs phase06/wallet.test.mjs phase07/hub.browser.test.mjs | tee test-results/report.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream-spa-phase07br-live-${{ matrix.viewport }}
          path: test-results/
          if-no-files-found: error
