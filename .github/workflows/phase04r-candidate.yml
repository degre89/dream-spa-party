name: Phase 04-R candidate browser evidence
on:
  push:
    branches:
      - development/phase04r-expressions-coverage
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPA_URL: http://127.0.0.1:8000/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chrome
      - name: Serve branch locally without publishing
        run: |
          python3 -m http.server 8000 > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Playwright three viewports
        run: |
          mkdir -p test-results
          set -o pipefail
          node --test --test-reporter=tap phase04/browser.test.mjs | tee test-results/report.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream-spa-phase04r-candidate-evidence
          path: |
            test-results/
            server.log
          if-no-files-found: warn
